<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Solar Blue Gradient -->
    <linearGradient id="pvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Sun Amber Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#08783E"/>
    </linearGradient>
    
    <!-- Secondary Leaf Gradient -->
    <linearGradient id="leafLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Sun Rays & Core in Background -->
  <g id="sun" transform="translate(130, 60)" filter="url(#subtleShadow)">
    <circle cx="0" cy="0" r="28" fill="url(#sunGrad)"/>
    <!-- Sun Rays radiating outwards -->
    <path d="M 0,-38 L 0,-46 M 27,-27 L 33,-33 M 38,0 L 46,0 M 27,27 L 33,33 M -27,-27 L -33,-33 M -38,0 L -46,0" 
          stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Solar PV Panel (Tilted Rhombus Perspective) -->
  <g id="solar-panel" filter="url(#subtleShadow)">
    <!-- Base Panel Face -->
    <polygon points="50,110 125,55 165,75 90,130" fill="url(#pvGrad)" stroke="#CBD5E1" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Grid Lines (Silicon cells) -->
    <!-- Transverse lines -->
    <line x1="75" y1="92" x2="138" y2="62" stroke="#93C5FD" stroke-width="1.2" opacity="0.6"/>
    <line x1="100" y1="74" x2="152" y2="69" stroke="#93C5FD" stroke-width="1.2" opacity="0.6"/>
    <line x1="68" y1="119" x2="108" y2="89" stroke="#93C5FD" stroke-width="1.2" opacity="0.6"/>
    
    <!-- Longitudinal lines -->
    <line x1="87.5" y1="82.5" x2="127.5" y2="102.5" stroke="#93C5FD" stroke-width="1.2" opacity="0.6"/>
    <line x1="68.7" y1="96.2" x2="108.7" y2="116.2" stroke="#93C5FD" stroke-width="1.2" opacity="0.6"/>
    <line x1="106.2" y1="68.7" x2="146.2" y2="88.7" stroke="#93C5FD" stroke-width="1.2" opacity="0.6"/>

    <!-- Frame Shadow Accent -->
    <polygon points="50,110 90,130 90,134 50,114" fill="#0F172A" opacity="0.7"/>
    <polygon points="90,130 165,75 165,78 90,134" fill="#1E293B" opacity="0.9"/>
  </g>

  <!-- Agricultural Crops / Double Leaves Rising from Ground -->
  <g id="leaves" filter="url(#subtleShadow)">
    <!-- Primary Green Leaf -->
    <path d="M 45,155 C 40,115 80,95 110,95 C 115,125 90,155 45,155 Z" fill="url(#leafGrad)"/>
    <!-- Leaf Center Rib -->
    <path d="M 45,155 Q 75,128 110,95" stroke="#DCFCE7" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Secondary Accent Leaf -->
    <path d="M 85,160 C 95,130 135,115 155,120 C 150,145 125,165 85,160 Z" fill="url(#leafLightGrad)"/>
    <!-- Secondary Leaf Rib -->
    <path d="M 85,160 Q 120,142 155,120" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Fertile Soil Mound -->
  <ellipse cx="75" cy="165" rx="45" ry="6" fill="#854D0E" opacity="0.25"/>
</svg>
